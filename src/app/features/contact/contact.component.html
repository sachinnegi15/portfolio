<section id="contact"
    class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-gray-600 via-gray to-gray-900 px-6 md:px-16 py-20">

    <!-- Title -->
    <div class="text-center mb-12 animate-fade-in-up">
        <h2 class="text-3xl md:text-4xl font-bold text-white-800">Get in Touch</h2>
        <p class="text-white-600 mt-2 max-w-3xl">I will be happy to receive your contact if you want to talk about new
            opportunities. Write me, and I will reply as soon as I see your message.</p>
    </div>

    <!-- Contact Form -->
    <div class="w-full max-w-3xl bg-gray-800 shadow-lg rounded-2xl p-8 animate-fade-in">
        <form class="space-y-6" [formGroup]="contactForm">
            <!-- Name -->
            <!-- Name -->
            <div>
                <label class="block text-sm font-medium text-white-700">Name</label>
                <input type="text" placeholder="Your name" class="mt-2 w-full rounded-lg border-gray-300 shadow-sm 
           focus:border-indigo-500 focus:ring-indigo-500 
           text-base px-4 py-3 placeholder-white-400" formControlName="name">
                <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Name is required.
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-white-700">Email</label>
                <input type="email" placeholder="you@example.com" class="mt-2 w-full rounded-lg border-gray-300 shadow-sm 
           focus:border-indigo-500 focus:ring-indigo-500 
           text-base px-4 py-3 placeholder-white-400" formControlName="email">
                <div *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Please enter a valid email.
                </div>
            </div>

            <!-- Message -->
            <div>
                <label class="block text-sm font-medium text-white-700">Message</label>
                <textarea rows="5" placeholder="Your message..." class="mt-2 w-full rounded-lg border-gray-300 shadow-sm 
           focus:border-indigo-500 focus:ring-indigo-500 
           text-base px-4 py-3 placeholder-white-400" formControlName="message"></textarea>
            </div>


            <!-- Submit Button -->
            <div class="d flex justify-center">
                <!-- <button type="submit" (click)="onSubmit()" [disabled]="contactForm.invalid"
                    class="px-8 py-3 rounded-full bg-indigo-600 text-white font-semibold shadow hover:bg-indigo-700 transition cursor-pointer">
                    Send Message
                </button> -->

                <button type="submit" (click)="onSubmit()" [disabled]="contactForm.invalid || isSending"
                    class="relative px-8 py-3 rounded-full bg-indigo-600 text-white font-semibold shadow hover:bg-indigo-700 transition cursor-pointer flex items-center justify-center">
                    <ng-container *ngIf="!isSending; else loading">
                        Send Message
                    </ng-container>

                    <ng-template #loading>
                        <p class="mr-2">Sending...</p>
                        <svg aria-hidden="true" class="w-5 h-5 animate-spin text-white fill-indigo-200"

                </button>

            </div>
        </form>
    </div>
